<!DOCTYPE html>

<!-- BUILD_SUPABASE_CONFIG -->
<script>
// Every iOS browser uses WebKit, and its fixed-position compositor can paint
// controls away from their hit-test boxes after the browser chrome moves. Mark
// browser tabs (but not installed PWAs) early so the app shell can use a local
// document coordinate system there. Chrome gets the legacy class as well for
// compatibility with older cached bundles.
(function () {
  var ua = navigator.userAgent || '';
  var ios = /iPhone|iPad|iPod/i.test(ua) || (/Macintosh/i.test(ua) && navigator.maxTouchPoints > 1);
  var standalone = !!(navigator.standalone || (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches));
  if (ios && !standalone) {
    document.documentElement.classList.add('ios-browser');
    if (/CriOS\//i.test(ua)) document.documentElement.classList.add('ios-chrome');
  }
})();
</script>
<meta name="theme-color" content="#07060a" />
<title>Zane · Training, nutrition and coaching</title>

<meta name="description" content="Zane is an all-in-one fitness app for adaptive training plans, workout logging, nutrition, health metrics, friends and coaching. Workouts remain usable offline." />
<!-- Share metadata. Without these a link to the app renders as a bare URL in
     WhatsApp, Instagram, Discord and every other chat app, which is how it sat
     for a long time. Absolute URLs are required, scrapers do not resolve
     relative ones. The image is built from tools/og-card.html; edit that
     rather than the JPEG. Crawlers fetch this file from the server directly
     and never touch the service worker, so these take effect on deploy
     without a cache bump. -->
<meta property="og:type" content="website" />
<meta property="og:site_name" content="Zane" />
<meta property="og:url" content="https://zane-wo.com/" />
<meta property="og:title" content="Zane · Train with Zane or remain the same" />

<!-- 'black' (opaque, OS-owned bar) instead of 'black-translucent' (full
     bleed, app content shows through the status bar): a newer iOS version
     started rendering the app's own blurred sticky headers (TopBar in
     ui.jsx, the same pattern everywhere) visibly through the translucent
     status bar, making the time/battery/signal glyphs look smeared. 'black'
     matches the app's default dark theme (light/paper theme users still get
     a black bar, this tag can't react to the in-app theme choice) and takes
     the whole interaction off the table: whatever iOS does with translucent
     chrome compositing next can't reach us if we never opt into it. -->
<meta name="apple-mobile-web-app-status-bar-style" content="black" />
<meta name="apple-mobile-web-app-title" content="Zane" />

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" crossorigin="anonymous" />
<style>
  :root {
    --bg: #07060a;
    --bg-raised: #100d0b;
    --bg-inset: #1a1611;
    --bg-body: #050409;
    --bg-rgb: 7,6,10;
    --ink: #ece4d0;
    --ink-soft: rgba(236,228,208,0.66);
    --ink-faint: rgba(236,228,208,0.34);
    --ink-ghost: rgba(236,228,208,0.14);
    --hair: rgba(236,228,208,0.09);
    --hair-strong: rgba(236,228,208,0.16);
    /* Accent-toned hairline: the border a row, chip or toggle wears when it is
       the selected/current one. Same threshold problem --hair-strong had, and
       worse here because it usually sits on an accent-tinted fill, so border
       and background are the same hue. Only for --hair-width borders: accent
       borders drawn thicker stay at their own lower alpha, since more line
       already carries the same visual mass. Follows the chosen accent
       automatically via --accent-rgb, in every theme. */
    --hair-accent: rgba(var(--accent-rgb),0.45);
    /* Width for every hairline border (the huge majority of UI.hair/
       UI.hairStrong borders use this literal). A theme can widen it.

       A whole pixel, deliberately, even though these are hairlines. Below 1px
       the width lands between device pixels (0.5px is 1.5 of them at 3x) and
       the engine has to round it per edge. WebKit can round one edge of a box
       to nothing, which showed up as a row keeping three sides and losing the
       fourth: measured on device, an edge was either at full strength or gone,
       never half, which is rounding rather than antialiasing. At 1px there is
       nothing to round away. The alphas above are set against this width, so
       moving one without the other changes how heavy every line in the app
       looks. */
    --hair-width: 1px;
    /* Empty-track color for input[type="range"] (see the rules below). Same
       as --hair-strong for every theme except paper, which points this at
       its own lighter bg-inset instead (see the paper block for why). */
    --range-track: var(--hair-strong);
    /* RGB triple used by decorative textures (knurl, guilloche). Flipped to a
       dark value in light mode so the hash marks stay visible on a pale bg. */
    --knurl-rgb: 236,228,208;
    /* Full background-image value for the theme's canvas (Screen component).
       'none' for every theme except paper, which sets a graph-paper grid. */
    --bg-texture: none;
    /* Multiplier on every knurl/guilloche alpha stop below, so a theme (paper)
       can make the texture read darker without every consumer changing. */
    --knurl-opacity: 1;
    /* text-shadow applied on Screen's root (inherits to everything under it
       unless a surface with its own opaque/semi-opaque background, like Card,
       Sheet, or a solid-fill Btn, resets it back to 'none'). 'none' for every
       theme except paper, whose bare grid canvas needs plain text lifted off
       the ruled lines to stay readable; a surface that already has its own
       background doesn't need it and would just look muddy. */
    --text-lift: none;
    /* Same value as --text-lift, but the "off" state is a zero-effect shadow
       instead of the bare keyword 'none'. text-shadow's grammar allows 'none'
       OR a comma-separated shadow list, never 'none' as one item inside a
       list, so anywhere --text-lift needs to combine with another shadow in
       the same declaration (perfectWeekPulse below is the only such case),
       reference this instead: 'none, 0 0 14px …' is invalid CSS and drops
       the whole declaration, silently killing the animation on every theme
       but paper (L2, audit-2026-08). Every other (single-value) use of
       --text-lift is unaffected and should keep using --text-lift directly. */
    --text-lift-safe: 0 0 0 rgba(0,0,0,0);
    /* Same idea as --text-lift, but for the .knurl divider bar (box-shadow,
       not text-shadow, since it is a flat gradient strip, not text). */
    --knurl-lift: none;
    /* Same idea as --text-lift, but for SVG chart <text> labels: CSS
       text-shadow does not paint on SVG text at all in this browser (verified
       directly: the computed value inherits fine, nothing renders), so those
       need the SVG-native equivalent (a feDropShadow filter, see #chart-text-lift
       below) instead, driven by this opacity rather than a text-shadow string.
       0 (invisible) until the grid is on. */
    --chart-text-lift-opacity: 0;
    /* flood-color for that same filter: must track the theme's own bgRaised
       tone (set in applyDarkMode) like --text-lift/--knurl-lift do, not stay
       fixed on paper's old off-white. A light flood on dark-mode's small
       axis labels reads as a glaring, illegible blob instead of a halo. */
    --chart-text-lift-color: #f9fafb;
    /* Surface tints, cream-on-dark defaults; overridden in light mode */
    --surface-tint:      rgba(236,228,208,0.02);
    --surface-tint-sm:   rgba(236,228,208,0.03);
    --surface-tint-md:   rgba(236,228,208,0.04);
    --surface-tint-lg:   rgba(236,228,208,0.06);
    --root-glow:         rgba(236,228,208,0.06);
    --overlay-tint:      rgba(255,255,255,0.03);
    --success-tint-xs:   rgba(127,212,160,0.05);
    --success-border:    rgba(127,212,160,0.25);
    --neutral-tint:      rgba(160,160,160,0.07);
    --neutral-border-sm: rgba(160,160,160,0.3);
    --success-text:      #7fd4a0;
    --accent: #c9a961;
    --accent-light: #e5c97e;
    --accent-deep: #8b6f3d;
    --accent-rgb: 201,169,97;
    /* Text/icon color for anything painted directly on a solid --accent fill
       (badges, toggles, primary buttons). Near-black reads fine on every
       accent color in the palette, all of which are mid-to-bright; only
       paper's muted grey accent is dark enough to need a light ink instead. */
    --accent-ink: #0a0805;
    /* Multiplier on --accent-faint/--accent-soft below, same idea as
       --knurl-opacity: a theme (paper) can richen these shared tint/border
       tokens without every one of their many call sites changing. */
    --accent-tint-boost: 1;
    --accent-faint: rgba(var(--accent-rgb),calc(0.10 * var(--accent-tint-boost)));
    --accent-soft: rgba(var(--accent-rgb),calc(0.30 * var(--accent-tint-boost)));
    --danger: #c87469;
    --danger-rgb: 200,116,105;
    --danger-border-boost: 1;
    --ok: #7fd4a0;
    --ok-rgb: 127,212,160;
    --warn: #e6b800;
    --warn-rgb: 230,184,0;
    --info: #8fa3ea;
    --info-rgb: 143,163,234;
  }
  html, body { min-height: 100vh; margin: 0; }
  html, body {
    background: var(--bg-body);
    color: var(--ink);
    font-family: "Inter", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    /* The app shell is fixed and owns the only legitimate scroll surface.
       Keeping the document itself locked prevents Safari's body scrollbar
       from appearing when a short Screen is swiped. */
    overflow: hidden;
    overscroll-behavior: none;
    user-select: none;
    -webkit-user-select: none;
  }
  body {
    /* phone-shaped viewport on desktop */
    display: flex; justify-content: center; align-items: stretch;
    background: var(--bg-body);
  }
  #root {
    position: fixed;
    top: var(--app-viewport-top, 0px);
    left: 0; right: 0; bottom: auto;
    height: var(--app-viewport-height, 100dvh);
    margin: 0 auto;
    width: 100%; max-width: 440px;
    background: var(--bg);
    /* Peeks through around the floating TabBar dock's rounded corners and
       on overscroll bounce, a flat surface with no blur (unlike TopBar/
       TabBar's own frosted-glass backgrounds, which deliberately stay
       ungridded so a crisp pattern doesn't fight the blur), so it gets the
       same paper grid treatment as every other flat surface. */
    background-image: var(--bg-texture);
    box-shadow: 0 0 0 1px var(--root-glow);
    display: flex; flex-direction: column;
    overflow: hidden;
  }
  /* While a native keyboard is open, the bottom dock is not useful and takes
     away exactly the space needed by the focused field. Keep the dock mounted
     so its state and hit-test geometry are preserved, but collapse its shell
     rather than leaving an invisible strip or unmounting it mid-edit. */
  [data-zane-tabbar="bottom"] {
    max-height: 180px;
    overflow: hidden;
    opacity: 1;
    transform: translateY(0);
    transition: max-height 0.18s ease, padding 0.18s ease, opacity 0.12s ease, transform 0.18s ease;
  }
  html.keyboard-input-active [data-zane-tabbar="bottom"] {
    max-height: 0 !important;
    padding-top: 0 !important;
    padding-bottom: 0 !important;
    opacity: 0 !important;
    transform: translateY(10px);
    pointer-events: none !important;
    visibility: hidden;
  }
  /* Optional accessibility scale. This is deliberately a device-local
     presentation setting, not a database preference. Scale text rather than
     the app shell: zooming #root also enlarged cards, gaps and fixed widths,
     which made compact rows wrap into each other. Text inflation lets the
     content become taller and use its normal scroll surface while buttons and
     hit targets keep their geometry. */
  html.large-text {
    -webkit-text-size-adjust: 112%;
    text-size-adjust: 112%;
  }
  /* iOS browsers can paint fixed layers at a stale browser-toolbar offset
     while hit-testing against their current CSS geometry. Keep the app shell
     in document positioning in browser tabs so paint and input coordinates
     share the same containing block. Installed PWAs keep the fixed shell. */
  html.ios-browser body {
    /* Make the body the local containing block for the absolute app shell and
       for the small number of body-level portals. Keeping the document itself
       non-scrollable prevents WebKit's page pan from becoming a second,
       invisible coordinate system while the Screen scrollers do their work. */
    position: relative;
    overflow: hidden;
    /* Include the compensating top in the body's box. When WebKit has panned
       the visual viewport upward, the corrected root starts lower in document
       coordinates; without this extra span body overflow would clip its
       bottom edge even though the root itself is the right size. */
    height: calc(var(--app-viewport-height, 100dvh) + var(--app-viewport-top, 0px));
    min-height: calc(var(--app-viewport-height, 100dvh) + var(--app-viewport-top, 0px));
  }
  html.ios-browser #root {
    position: absolute;
    /* Fixed descendants (sheets, alerts, lightboxes) must share the app
       shell's containing block. Otherwise Chrome iOS can paint the shell in
       document coordinates but hit-test a fixed overlay in stale visual-
       viewport coordinates after its browser chrome or keyboard moves. */
    transform: translateZ(0);
  }
  /* Body-level portals use the same corrected document viewport as #root.
     `inset:0` alone is subtly wrong when Safari has panned the visual
     viewport: body includes the correction span, so an absolute portal would
     be centred between document y=0 and the root instead of over the root.
     Only portals explicitly marked by the app are adjusted; root children
     keep their normal local `inset:0` geometry. */
  html.ios-browser body > [data-zane-local-layer="viewport"] {
    top: var(--app-viewport-top, 0px) !important;
    height: var(--app-viewport-height, 100dvh) !important;
    bottom: auto !important;
  }
  /* A one-frame compositor reset used after a layout release or from
     Settings -> Appearance. Removing the root layer transform and forcing a
     layout read makes WebKit discard stale paint/hit-test geometry without
     navigating away from a running workout. */
  html.zane-viewport-reflow #root { transform: none !important; }
  @media (min-width: 768px) {
    #root {
      max-width: 100%;
      box-shadow: none;
    }
  }
  /* Installed PWA: #root (position:fixed) draws --bg; the body behind it is the
     slightly darker --bg-body. On iOS, WebKit can momentarily inset/shift #root
     below the status bar after a visualViewport change (keyboard), revealing the
     body as a band behind the clock. Match the body to --bg there so the reveal
     is invisible. (Browser/desktop keep the darker "phone frame" surround.) */
  @media (display-mode: standalone) {
    html, body { background: var(--bg); }
  }
  * { box-sizing: border-box; }
  /* Interactive controls are surfaces, so they must not inherit the paper
     grid lift from Screen. Plain background text keeps the inherited lift;
     a control that truly needs it must opt in explicitly. */
  button, input, select, textarea { text-shadow: none; }
  /* No theme ever styled ::placeholder, so every input/textarea's hint
     text (an autofilled example, a computed "from macros" value shown as
     a placeholder, ...) fell back to each browser's own default fade of
     its `color`, unrelated to the ink scale every other faint/hint text
     in the app is tuned against. Pin it to ink-faint explicitly instead. */
  input::placeholder, textarea::placeholder { color: var(--ink-faint); opacity: 1; }
  /* Native <input type="range"> styled via the CSS accent-color property
     (the previous approach here) leaves the UNFILLED track color up to the
     browser's own contrast heuristic against that accent-color value, with
     no color-scheme declared anywhere in this app to hint it. Confirmed
     directly: the exact same page, only the accent hex swapped (gold vs
     copper), rendered one near-black and the other near-white, with no
     theme change involved at all, an unpredictable per-color guess rather
     than anything this app controls. Fully custom-style track + thumb
     instead: the caller supplies the filled-vs-unfilled split via an inline
     background gradient (see the watermark opacity slider), this rule set
     just removes the native chrome and pins the thumb to the real accent
     and the (transparent, WebKit) track background to whatever gradient the
     caller set. */
  input[type="range"] {
    -webkit-appearance: none;
    appearance: none;
    width: 100%;
    height: 4px;
    border-radius: 999px;
    outline: none;
    cursor: pointer;
  }
  input[type="range"]::-webkit-slider-runnable-track {
    -webkit-appearance: none;
    height: 4px;
    border-radius: 999px;
    background: transparent;
  }
  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 18px;
    height: 18px;
    border-radius: 50%;
    background: var(--accent);
    margin-top: -7px;
    cursor: pointer;
  }
  input[type="range"]::-moz-range-track {
    height: 4px;
    border-radius: 999px;
    background: var(--range-track);
  }
  input[type="range"]::-moz-range-progress {
    height: 4px;
    border-radius: 999px;
    background: var(--accent);
  }
  input[type="range"]::-moz-range-thumb {
    width: 18px;
    height: 18px;
    border-radius: 50%;
    background: var(--accent);
    border: none;
    cursor: pointer;
  }
  /* Autoreg guide (screens-autoreg-guide.jsx), section 03 feedback options:
     two columns on a phone, three on a wide screen. A media query (not CSS
     auto-fit) so a narrow phone reliably keeps two columns instead of dropping
     to one once the panel padding eats into the available width. */
  .ag-opt-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 8px; }
  @media (min-width: 760px) { .ag-opt-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
  input[type=number]::-webkit-outer-spin-button,
  input[type=number]::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
  input[type=number] { -moz-appearance: textfield; }
  /* Keep the historical layer promotion for non-iOS browsers. On iOS the
     promotion itself can preserve a stale compositor/hit-test layer after the
     browser chrome moves, so browser-tab fields opt out below. The keyboard
     focus helper still handles caret visibility without this transform. */
  input, textarea { transform: translateZ(0); }
  html.ios-browser input, html.ios-browser textarea { transform: none; }
  /* Compact fields keep their normal size at rest. On iOS the focus handler
     adds this class only when a field would otherwise trigger Safari's
     automatic page zoom, so the keyboard can open without shifting the app's
     layout. */
  .zane-ios-input-zoom-guard { font-size: 16px !important; }
  input:-webkit-autofill,
  input:-webkit-autofill:hover,
  input:-webkit-autofill:focus {
    -webkit-box-shadow: 0 0 0 1000px transparent inset !important;
    box-shadow: 0 0 0 1000px transparent inset !important;
    -webkit-text-fill-color: var(--ink) !important;
    transition: background-color 5000s ease-in-out 0s;
  }
  button { font: inherit; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
  a { -webkit-tap-highlight-color: transparent; }
  /* Keyboard focus has to be visible on the switch: it is a real button now
     (UI.Toggle), so it takes focus, and a focus you cannot see is worse than
     no focus at all. :focus-visible only, so a tap never draws a ring. The
     offset keeps it clear of the 13px pill edge. */
  [role="switch"]:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }
  ::-webkit-scrollbar { width: 0; height: 0; }

  /* industrial crosshatch texture */
  .guilloche {
    background-image:
      repeating-linear-gradient(
        45deg,
        rgba(var(--knurl-rgb),calc(0.018 * var(--knurl-opacity))) 0px, rgba(var(--knurl-rgb),calc(0.018 * var(--knurl-opacity))) 1px,
        transparent 1px, transparent 10px
      ),
      repeating-linear-gradient(
        -45deg,
        rgba(var(--knurl-rgb),calc(0.018 * var(--knurl-opacity))) 0px, rgba(var(--knurl-rgb),calc(0.018 * var(--knurl-opacity))) 1px,
        transparent 1px, transparent 10px
      );
  }
  .guilloche-h {
    background-image: repeating-linear-gradient(
      0deg,
      transparent 0, transparent 5px,
      rgba(var(--knurl-rgb),calc(0.025 * var(--knurl-opacity))) 5px, rgba(var(--knurl-rgb),calc(0.025 * var(--knurl-opacity))) 6px
    );
  }

  /* utility classes used by JSX */
  .num { font-family: "JetBrains Mono", ui-monospace, monospace; font-variant-numeric: tabular-nums; letter-spacing: 0.02em; }
  .display { font-family: "Big Shoulders Display", "Arial Narrow", sans-serif; font-weight: 700; letter-spacing: 0.03em; text-transform: uppercase; }
  .display-it { font-family: "Big Shoulders Display", "Arial Narrow", sans-serif; font-weight: 900; letter-spacing: 0.02em; text-transform: uppercase; }
  .micro { font-family: "Inter", system-ui, sans-serif; font-size: 9px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--ink-faint); font-weight: 500; }
  .micro-gold { font-family: "Inter", system-ui, sans-serif; font-size: 9px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--accent); font-weight: 600; }
  .label { font-family: "Inter", system-ui, sans-serif; font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink-faint); font-weight: 500; }
  .label-gold { font-family: "Inter", system-ui, sans-serif; font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--accent); font-weight: 600; }

  /* Health tab's Today/Week stat cells (HealthMetricsCard's stat(), HealthWeekCard's
     cell(), screens-health.jsx): a value + unit pair (e.g. "155.9 lbs") in a narrow
     flex/grid column, with nothing clipping overflow. On a small phone a long value
     (a 3-digit weight, a 5-digit step count) can render wider than its column and
     spill into the next stat instead of wrapping, reported as "the step count is
     overlapping the lbs". Shrinking these two font sizes below a phone-width
     breakpoint keeps every value+unit pair inside its own column. */
  .health-stat-value { font-size: 22px; }
  .health-stat-unit { font-size: 11px; }
  .health-cell-value { font-size: 16px; }
  .health-cell-unit { font-size: 9px; }
  @media (max-width: 430px) {
    .health-stat-value { font-size: 18px; }
    .health-stat-unit { font-size: 9px; }
    .health-cell-value { font-size: 13px; }
    .health-cell-unit { font-size: 8px; }
  }

  @keyframes sheet-up { from { transform: translateY(30%); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
  @keyframes sheet-fade { from { opacity: 0; } to { opacity: 1; } }
  @keyframes timerPulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.25; } }
  @keyframes logoPulse { 0%, 100% { box-shadow: 0 0 0 0 rgba(var(--accent-rgb),0.5); } 60% { box-shadow: 0 0 0 18px rgba(var(--accent-rgb),0); } }
  @keyframes improvedBorderPulse {
    0%, 100% { box-shadow: inset 0 0 40px 12px rgba(var(--accent-rgb),0.25); }
    50%       { box-shadow: inset 0 0 70px 22px rgba(var(--accent-rgb),0.55); }
  }
  @keyframes improvedFade {
    0%   { opacity: 0; }
    8%   { opacity: 1; }
    72%  { opacity: 1; }
    100% { opacity: 0; }
  }
  @keyframes regressionBorderPulse {
    0%, 100% { box-shadow: inset 0 0 40px 12px rgba(var(--danger-rgb),0.25); }
    50%       { box-shadow: inset 0 0 70px 22px rgba(var(--danger-rgb),0.55); }
  }
  @keyframes pulseGold { 0%, 100% { box-shadow: 0 20px 60px rgba(var(--accent-rgb),0.30), 0 0 0 var(--hair-width) rgba(var(--accent-rgb),0.6), inset 0 1px 0 rgba(255,240,200,0.4), inset 0 -8px 24px rgba(0,0,0,0.25); } 70% { box-shadow: 0 20px 60px rgba(var(--accent-rgb),0.30), 0 0 0 14px rgba(var(--accent-rgb),0), inset 0 1px 0 rgba(255,240,200,0.4), inset 0 -8px 24px rgba(0,0,0,0.25); } }
  @keyframes pulseDot { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
  /* Bakes translateX(-50%) into both ends, unlike fadeUp: an element already
     centred via a static translateX(-50%) would otherwise have that
     completely overridden (not composed with) for the animation's duration,
     since a keyframe's transform replaces the property outright, then snap
     back once the animation ends, that's what a genie-pop scale needs to
     avoid looking like a slide-in from one side. */
  @keyframes tabPopIn { from { opacity: 0; transform: translateX(-50%) scale(0.35); } to { opacity: 1; transform: translateX(-50%) scale(1); } }
  @keyframes rowFlash { 0% { box-shadow: inset 0 0 0 9999px rgba(127,212,160,0.20); } 100% { box-shadow: inset 0 0 0 9999px rgba(127,212,160,0); } }
  @keyframes perfectWeekPulse { 0%, 100% { text-shadow: var(--text-lift-safe), 0 0 0px rgba(var(--accent-rgb),0); } 50% { text-shadow: var(--text-lift-safe), 0 0 14px rgba(var(--accent-rgb),0.9); } }
  @keyframes tourRingPulse { 0%, 100% { box-shadow: 0 0 0 0 rgba(var(--accent-rgb),0.5); } 60% { box-shadow: 0 0 0 8px rgba(var(--accent-rgb),0); } }
  /* Bigger/brighter ring than tourRingPulse, needs to read clearly on a tiny
     26px checkbox, so the subtler tour version isn't enough here. */
  @keyframes unlockRingPulse { 0%, 100% { box-shadow: 0 0 0 0 rgba(var(--accent-rgb),0.9); } 50% { box-shadow: 0 0 0 12px rgba(var(--accent-rgb),0); } }
  .perfect-week-pulse { animation: perfectWeekPulse 2.4s ease-in-out infinite; }
  @keyframes intensityGlow {
    0%, 100% { box-shadow: 0 0 6px rgba(var(--accent-rgb),0.4), 0 0 20px rgba(var(--accent-rgb),0.12); }
    50%       { box-shadow: 0 0 14px rgba(var(--accent-rgb),0.72), 0 0 36px rgba(var(--accent-rgb),0.26); }
  }
  .intensity-glow { animation: intensityGlow 2.5s ease-in-out infinite; }
  @keyframes intensityGlowRaw {
    0%, 100% { box-shadow: 0 0 6px rgba(var(--accent-raw-rgb),0.4), 0 0 20px rgba(var(--accent-raw-rgb),0.12); }
    50%       { box-shadow: 0 0 14px rgba(var(--accent-raw-rgb),0.72), 0 0 36px rgba(var(--accent-raw-rgb),0.26); }
  }
  .intensity-glow-raw { animation: intensityGlowRaw 2.5s ease-in-out infinite; }
  /* Same breathing curve as intensityGlow, recolored to --warn: the Shopping
     List's "Running Low" section (screens-food.jsx), a food whose derived
     stock has dropped under one package's worth. */
  @keyframes lowStockGlow {
    0%, 100% { box-shadow: 0 0 6px rgba(var(--warn-rgb),0.4), 0 0 20px rgba(var(--warn-rgb),0.12); }
    50%       { box-shadow: 0 0 14px rgba(var(--warn-rgb),0.72), 0 0 36px rgba(var(--warn-rgb),0.26); }
  }
  .low-stock-glow { animation: lowStockGlow 2.5s ease-in-out infinite; }

  /* Food Tracker staged-picks bar: a small accent pill named for the item(s)
     just staged flies from the just-closed sheet's title area down into the
     docked bar's Add button (flyStagedChip in screens-food.jsx), where the
     bar squashes on landing, the button absorbs the chip with a pulse, and
     the count pops. Position + distance are dynamic (inline left/top plus
     --fx/--fy/--arc custom properties set per call); everything that does
     not vary lives here. Replaces the old whole-sheet genie clone, which
     read as a bare rectangle after its cssText wipe (see the fd818697
     revert history) and was too big to read as "the item"; this pill never
     depends on the sheet's own look. */
  .fd-chip {
    position: fixed; z-index: 600; pointer-events: none;
    display: flex; align-items: center;
    max-width: 220px; height: 30px; padding: 0 14px;
    border-radius: 999px;
    background: var(--accent);
    color: var(--accent-ink);
    font-family: "Inter", system-ui, sans-serif;
    font-size: 12px; font-weight: 600;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    box-shadow: 0 4px 16px rgba(var(--accent-rgb), 0.55);
    transform-origin: center center;
    text-shadow: none;
  }
  /* The flight itself: --fx/--fy hold the distance to the bar's Add button
     (set inline per call, same dynamic-property idiom as meso-ember below),
     --arc bows the midpoint slightly sideways so a near-vertical drop still
     reads as a throw rather than a fall. */
  @keyframes fdChipFly {
    0%   { transform: translate(0, 0) scale(1); opacity: 1; }
    45%  { transform: translate(calc(var(--fx, 0px) * 0.5 - var(--arc, 0px)), calc(var(--fy, 0px) * 0.44)) scale(0.88); opacity: 1; }
    100% { transform: translate(var(--fx, 0px), var(--fy, 0px)) scale(0.12); opacity: 0; }
  }
  /* Landing beats: one-shot, short, delayed ~0.36s so they hit as the chip
     arrives (~0.5s in). Re-triggered per landing by an effect in
     screens-food.jsx that sets the wrapper's animation to none, forces a
     reflow and restores it (stagedLandRef), so only the beat replays while
     the bar subtree keeps its DOM identity (the breathing glow never
     restarts, the expanded list keeps its scroll). The chevron and the Add
     span carry key={landTick} themselves and remount for their own one-shot
     animations; the count span is keyed on landTick too, so a per-item
     removal never replays the pop. The resting 0% frame plus `both` fill
     keeps the delay period visually silent. */
  @keyframes fdBarLand {
    0%   { transform: translateY(0) scale(1, 1); }
    28%  { transform: translateY(-6px) scale(1.02, 0.86); }
    52%  { transform: translateY(2px) scale(0.99, 1.04); }
    74%  { transform: translateY(-2px) scale(1, 0.98); }
    100% { transform: translateY(0) scale(1, 1); }
  }
  @keyframes fdBtnAbsorb {
    0%   { transform: scale(1); }
    40%  { transform: scale(1.09); }
    100% { transform: scale(1); }
  }
  @keyframes fdCountPop {
    0%   { transform: scale(1); }
    40%  { transform: scale(1.35); }
    100% { transform: scale(1); }
  }
  /* The chevron tucks away while the bar bounces (the count label scales
     up into its slot during the same window, see fdCountPop) and fades
     back in as the box settles. The chevron icon itself carries
     key={landTick} in screens-food.jsx, so it remounts and replays on
     every landing while the wrapper stays mounted (a keyed wrapper would
     restart the breathing glow and reset the expanded list's scroll);
     removal doesn't remount it, so it stays visible there. */
  @keyframes fdChevronHide {
    0%   { opacity: 1; }
    20%  { opacity: 0; }
    80%  { opacity: 0; }
    100% { opacity: 1; }
  }
  .fd-bar-land { animation: fdBarLand 0.42s ease-out 0.36s both; }
  .fd-btn-absorb { display: inline-flex; animation: fdBtnAbsorb 0.26s ease-out 0.36s both; }
  .fd-count-pop { display: inline-block; animation: fdCountPop 0.3s ease-out 0.36s both; }
  .fd-chevron-hide { animation: fdChevronHide 0.42s ease-out 0.36s both; }
  @media (prefers-reduced-motion: reduce) {
    .fd-chip, .fd-bar-land, .fd-btn-absorb, .fd-count-pop, .fd-chevron-hide { animation: none !important; }
  }

  /* Beyond-failure meso summary: the whole Options box smoulders when the end
     RIR dips below 0 (hot orange inner, red outer, same palette as the ember
     watermark) so a "hell cycle" reads at a glance. */
  @keyframes hellGlow {
    0%, 100% { box-shadow: 0 0 8px rgba(255,120,40,0.40), 0 0 24px rgba(210,45,0,0.22); }
    50%      { box-shadow: 0 0 18px rgba(255,120,40,0.78), 0 0 42px rgba(210,45,0,0.42); }
  }

  /* Same hell palette as hellGlow, but rendered as a soft radial smoulder that
     fades to transparent before the edges, so it reads as fire glowing from
     within a row rather than a printed-on box with an outline. Used behind the
     5/3/1 AMRAP top set once its ramp sets are logged. */
  @keyframes hellPulse {
    0%, 100% { opacity: 0.55; }
    50%      { opacity: 1; }
  }

  /* Beyond-failure meso: the RIR watermark literally catches fire as the
     target dips below 0. Everything is driven by inline custom props set per
     intensity (−1 → −3): --ember-op (base opacity), --ember-blur (glow
     radius), and a two-layer warm palette --ember-glow1 (hot inner) /
     --ember-glow2 (red outer). Irregular keyframe steps read as an organic
     flame flicker rather than a symmetric "breath", and the base cycle is
     slow (~2.4s, overridden per intensity) so it smoulders instead of
     strobing. */
  @keyframes meso-ember {
    0%   { opacity: calc(var(--ember-op,0.24) * 0.78);
           text-shadow: 0 0 calc(var(--ember-blur,24px)*0.7) var(--ember-glow1, rgba(255,150,50,0.9)),
                        0 0 calc(var(--ember-blur,24px)*1.7) var(--ember-glow2, rgba(210,45,0,0.5)); }
    22%  { opacity: var(--ember-op,0.24);
           text-shadow: 0 0 var(--ember-blur,24px) var(--ember-glow1, rgba(255,150,50,0.9)),
                        0 0 calc(var(--ember-blur,24px)*2.5) var(--ember-glow2, rgba(210,45,0,0.5)); }
    41%  { opacity: calc(var(--ember-op,0.24) * 0.7);
           text-shadow: 0 0 calc(var(--ember-blur,24px)*0.85) var(--ember-glow1, rgba(255,150,50,0.9)),
                        0 0 calc(var(--ember-blur,24px)*1.9) var(--ember-glow2, rgba(210,45,0,0.5)); }
    60%  { opacity: calc(var(--ember-op,0.24) * 1.15);
           text-shadow: 0 0 calc(var(--ember-blur,24px)*1.4) var(--ember-glow1, rgba(255,180,70,0.95)),
                        0 0 calc(var(--ember-blur,24px)*3.1) var(--ember-glow2, rgba(255,55,0,0.6)); }
    79%  { opacity: calc(var(--ember-op,0.24) * 0.82);
           text-shadow: 0 0 calc(var(--ember-blur,24px)*0.95) var(--ember-glow1, rgba(255,150,50,0.9)),
                        0 0 calc(var(--ember-blur,24px)*2) var(--ember-glow2, rgba(210,45,0,0.5)); }
    100% { opacity: calc(var(--ember-op,0.24) * 0.78);
           text-shadow: 0 0 calc(var(--ember-blur,24px)*0.7) var(--ember-glow1, rgba(255,150,50,0.9)),
                        0 0 calc(var(--ember-blur,24px)*1.7) var(--ember-glow2, rgba(210,45,0,0.5)); }
  }
  .meso-ember { animation: meso-ember 2.4s ease-in-out infinite; will-change: opacity, text-shadow; }
  @media (prefers-reduced-motion: reduce) { .meso-ember { animation: none; opacity: var(--ember-op, 0.24); } }

  /* Drag-to-reorder (plan days · day exercises). Imperatively driven by
     UI.useDragReorder, the ghost is a clone of the picked-up row that
     tracks the finger, the drop-line marks where it will land. */
  body.reorder-dragging, body.reorder-dragging * { cursor: grabbing !important; }
  .reorder-source { opacity: 0.32 !important; transition: opacity .12s ease; }
  .reorder-ghost {
    position: fixed; z-index: 9999; margin: 0; pointer-events: none;
    box-sizing: border-box; will-change: transform, opacity;
    box-shadow: 0 18px 44px -12px rgba(0,0,0,0.7), 0 0 0 1px rgba(var(--accent-rgb),0.45);
    transition: opacity .14s ease;
  }
  .reorder-ghost * { pointer-events: none !important; }
  .reorder-drop-line {
    position: fixed; z-index: 9998; height: 2px; pointer-events: none;
    background: var(--accent); border-radius: 999px;
    box-shadow: 0 0 8px rgba(var(--accent-rgb),0.6);
  }
  .reorder-drop-line-h {
    position: fixed; z-index: 9998; width: 2px; pointer-events: none;
    background: var(--accent); border-radius: 999px;
    box-shadow: 0 0 8px rgba(var(--accent-rgb),0.6);
  }

  /* iOS status bar bleed-through (2026-08): a newer iOS shows the app's own
     blurred sticky headers (TopBar in ui.jsx) smeared through the status bar
     clock/battery/signal readout, on this phone only, every other app and
     the home screen look normal. Two dead ends already ruled out on-device:
     switching apple-mobile-web-app-status-bar-style black-translucent ->
     black (zero visible change), and a solid opaque shield pinned over
     env(safe-area-inset-top) at max z-index, at several heights including
     taller than the reported value (zero effect on the blur itself at ANY
     height, the only measurable effect was covering more of the app's own
     header). That rules out both "iOS ignores the meta tag" workarounds and
     "our shield is too short": whatever renders the smeared look isn't
     coming from our content bleeding through, and doesn't respond to
     anything we stack on top of it either. Current approach instead: push
     TopBar's own content down a few extra px (see ui.jsx), directly, no
     separate covering element. */

  /* Dumbbell knurling, diagonal hash marks like grip texture */
  .knurl {
    height: 3px;
    flex-shrink: 0;
    box-shadow: var(--knurl-lift);
    background: repeating-linear-gradient(
      -60deg,
      rgba(var(--knurl-rgb),calc(0.20 * var(--knurl-opacity))) 0px, rgba(var(--knurl-rgb),calc(0.20 * var(--knurl-opacity))) 1.5px,
      transparent 1.5px, transparent 6px
    );
  }

  /* Drives #chart-text-lift below (flood-opacity and flood-color ARE
     CSS-styleable properties, unlike stdDeviation, so those two are the
     themed knobs; the blur radius stays a fixed, always-small value since
     it's invisible anyway whenever opacity is 0). */
  #chart-text-lift feDropShadow {
    flood-opacity: var(--chart-text-lift-opacity);
    flood-color: var(--chart-text-lift-color);
  }
</style>
</head>
<body>
<noscript>
  <main style="max-width:760px;margin:48px auto;padding:0 24px;font-family:system-ui,sans-serif;line-height:1.6;color:#ece4d0;background:#141218">
    <h1>Zane</h1>
    <p>Zane is an all-in-one fitness app for adaptive training plans, workout logging, nutrition, health metrics, friends and coaching.</p>
    <p><a href="welcome.html" style="color:#e5c97e">Learn what Zane does</a></p>
  </main>
</noscript>
<div id="root"></div>
<!-- Global, zero-size SVG defs: any <text filter="url(#chart-text-lift)">
     anywhere in the app can reference this one filter (SVG filter refs work
     document-wide, not just within their own <svg>). Paper-only grid-lift
     for chart labels, see --chart-text-lift-opacity: 'plain text on the
     paper grid needs lifting' also applies to axis/value labels drawn as SVG
     text, which (verified directly) silently ignores CSS text-shadow. -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <filter id="chart-text-lift" x="-60%" y="-60%" width="220%" height="220%">
      <feDropShadow dx="0" dy="0" stdDeviation="1.4" flood-color="#f9fafb" />
    </filter>
  </defs>
</svg>
<div id="err" style="display:none;position:fixed;inset:0;background:#07060a;color:#c87469;font-family:monospace;font-size:13px;padding:24px;overflow:auto;z-index:9999">
  <div id="err-log" style="white-space:pre-wrap"></div>
</div>
<script>

// Known-benign global noise, never actionable here, and blocking the whole
// screen for it does real harm: browser extensions (crypto wallets like
// Brave's own built-in wallet, translators, etc.) inject their own scripts
// into every page and can throw on their own internal state, which
// window.onerror/onunhandledrejection can't tell apart from a real app bug.
var BENIGN_NOISE = /ResizeObserver loop|translateDisabled|ethereum/i;

// One-shot: the moment React actually mounts for the first time, hide the
// error overlay if it happens to be up. #root is guaranteed empty right now
// (this runs before any boot code), so the only way this fires is a genuine
// 0-children → n-children transition, and it self-destructs on that first
// fire: a LATER runtime error's overlay (root already has children by then)
// is untouched and stays up for the user to read/dismiss as intended. This
// covers every trigger path (onerror/onunhandledrejection/BOOT-catch/
// timeout) with one mechanism instead of each site managing its own poll.
// Without it, an error that fires mid-boot but the app still recovers from
// (e.g. a transient fetch blip absorbed by fetchTextRetry's single retry, or
// a stray console error unrelated to boot) left the overlay stuck open
// forever over a working app.
var earlyMountPoll = setInterval(function() {
  if (document.getElementById('root').children.length) {
    clearInterval(earlyMountPoll);
    var d = document.getElementById('err');
    if (d) d.style.display = 'none';
  }
}, 500);

// Shared by every path that shows this overlay (below, plus the "React did
// not mount" and BOOT-failure fallbacks further down), a stale/broken
// precompile cache is a common real cause, and "Dismiss" alone wouldn't fix
// that, only hide the symptom.
function makeClearCacheButton() {
  var btn = document.createElement('button');
  btn.textContent = 'Clear cache & reload';
  btn.style.cssText = 'margin-top:16px;margin-right:8px;display:inline-block;padding:10px 20px;background:#c87469;color:#07060a;border:none;border-radius:6px;font-family:monospace;font-size:13px;font-weight:700;cursor:pointer;letter-spacing:0.04em';
  btn.onclick = async function() {
    btn.textContent = 'Clearing…';
    // No unregister here either, for the reasons spelled out on
    // LB.clearCachesAndReload (it would destroy the push subscription, which
    // nothing re-creates). zane-cold-boot below is what stops the reload from
    // re-prompting for the pending update.
    if ('caches' in window) { var keys = await caches.keys(); await Promise.all(keys.map(function(k){ return caches.delete(k); })); }
    // Also nuke the IndexedDB precompile cache, a poisoned record there bricks
    // boot just as badly as a bad Cache Storage entry, and clearing only caches
    // would leave the app permanently broken with no recovery path.
    if ('indexedDB' in window) {
      await new Promise(function(resolve){
        var req = indexedDB.deleteDatabase('zane-precompile');
        req.onsuccess = req.onerror = req.onblocked = function(){ resolve(); };
      });
    }
    // Flags this as a deliberate cache wipe so the next boot's "React did not
    // mount" watchdog further down gives itself more time before giving up:
    // a wiped cache forces the guaranteed-slowest boot path (every source
    // file is an uncached network fetch), see that setTimeout for why.
    try { sessionStorage.setItem('zane-cold-boot', '1'); } catch (e) {}
    // reload(true)'s "force" argument is a removed, no-op legacy API in
    // modern browsers, a plain reload here can still be served stale by
    // the browser's own HTTP cache (a layer clearing CacheStorage/IndexedDB
    // never touches), via whichever service worker is still active. A
    // unique ?_v= query string guarantees no HTTP cache entry exists for
    // this exact URL, and sw.js's fetch handler already treats any ?_v=
    // request as always-network. Mirrors LB.clearCachesAndReload in
    // store.js (this file can't call into LB, it runs before store.js loads).
    window.location.href = window.location.pathname + '?_v=' + Date.now() + window.location.hash;
  };
  return btn;
}

// Shows the overlay with a "Clear cache & reload" button always available
// (in case a stale/broken cache is the actual cause) and, only once the
// app has actually mounted, so there's something usable to dismiss to, a
// lighter Dismiss button too.
function showErrOverlay() {
  var d = document.getElementById('err');
  if (d.style.display !== 'block') {
    d.style.display = 'block';
    d.appendChild(makeClearCacheButton());
    if (document.getElementById('root').children.length) {
      var dismiss = document.createElement('button');
      dismiss.textContent = 'Dismiss';
      dismiss.style.cssText = 'margin-top:16px;display:inline-block;padding:10px 20px;background:transparent;color:#c87469;border:1px solid #c87469;border-radius:6px;font-family:monospace;font-size:13px;cursor:pointer;letter-spacing:0.04em';
      dismiss.onclick = function() { d.style.display = 'none'; };
      d.appendChild(dismiss);
    }
  }
  return document.getElementById('err-log');
}

window.onerror = function(msg, src, line, col, err) {
  if (typeof msg === 'string' && BENIGN_NOISE.test(msg)) return;
  // Cross-origin/extension-injected scripts report as a bare "Script error."
  // with no location at all, the browser deliberately strips all detail for
  // these, so it's never actionable and is most often a browser extension
  // throwing on its own injected script, not a bug in this app.
  if (msg === 'Script error.' && !src && !line) return;
  showErrOverlay().textContent += '[JS ERROR] ' + msg + '\n  ' + src + ':' + line + '\n\n';
};
window.onunhandledrejection = function(e) {
  var reason = e.reason?.message || e.reason;
  if (typeof reason === 'string' && BENIGN_NOISE.test(reason)) return;
  showErrOverlay().textContent += '[PROMISE] ' + reason + '\n\n';
};
// Fallback: if React never mounts in time, show diagnostic info.
// Never auto-send SKIP_WAITING or reload here. A slow network, a suspended
// browser tab, or a waiting worker must not turn a recoverable boot delay into
// an unsolicited page navigation loop. The diagnostic overlay already offers
// the deliberate cache-and-reload recovery path.
// "Clear cache & reload" (this file's own button, and LB.clearCachesAndReload
// in store.js) sets zane-cold-boot right before navigating here: a wiped
// cache forces the guaranteed-slowest boot path (every source file including
// Babel itself is an uncached network fetch, no precompile cache to fall
// back on), which can legitimately take longer than a normal boot on a slow
// connection. Read-and-clear so only the one reload right after a wipe gets
// the longer grace period, not every subsequent load.
var coldBoot = false;
try { coldBoot = sessionStorage.getItem('zane-cold-boot') === '1'; sessionStorage.removeItem('zane-cold-boot'); } catch (e) {}
// The watchdog consumes the session flag above before React loads. Pass the
// same fact to app.jsx so a deliberate cache-wipe reload can silently hand off
// its waiting worker instead of raising the same update banner again.
window.__ZANE_COLD_BOOT = coldBoot;
setTimeout(async function() {
  if (document.getElementById('root').children.length) return;
  var waitingWorker = false;
  try {
    var reg = navigator.serviceWorker && await navigator.serviceWorker.getRegistration();
    waitingWorker = !!(reg && reg.waiting);
  } catch(e) {}
  // Routed through showErrOverlay() rather than toggling #err directly:
  // it's a no-op display-wise if a BOOT/JS-ERROR overlay is already up (its
  // own guard skips re-adding a second button), and still adds one here on
  // a bare timeout with nothing else having fired yet.
  var log = showErrOverlay();
  log.textContent += '[TIMEOUT] React did not mount.\n';
  if (waitingWorker) log.textContent += '[SERVICE WORKER] An update is waiting; no automatic reload was attempted.\n';
  log.textContent += 'window.LB: ' + typeof window.LB + '\n';
  log.textContent += 'window.supabase: ' + typeof window.supabase + '\n';
  log.textContent += 'window.Screens: ' + JSON.stringify(Object.keys(window.Screens||{})) + '\n';
  log.textContent += 'window.React: ' + typeof window.React + '\n';
  log.textContent += 'window.Screen: ' + typeof window.Screen + '\n';
  // A slow first boot can trip the timeout while the app is still coming up:
  // earlyMountPoll (top of this file) auto-hides this the moment React does
  // mount, so a working (just sluggish) app isn't left buried under an opaque
  // error screen.
}, coldBoot ? 15000 : 6000);
</script>

<script>
window.ACCENT_PALETTE = {

  // outright (boot() has no further automatic recovery, see showError below).

        .then(function () { return fetchTextOk(url); });
    });
  }

  // Append as a classic inline script so it runs synchronously and in order,
  // sharing the global scope exactly like the original text/babel scripts.
  //
  // A classic script's own runtime errors never throw back into this call:
  // the browser reports them via window.onerror instead (the same isolation
  // model as a cross-origin "Script error."), so execute() used to always
  // "succeed" from its caller's point of view even when the injected code
  // threw before finishing, e.g. partway through a chain of top-level const
  // declarations. That silently broke retry: runSource()/loadBuiltBundle()
  // marked the source executed (or left their promise resolved) regardless,
  // so window.Screens[name] was never actually populated, yet nothing was
  // ever rejected for the caller's own .catch/Retry path to react to,
  // leaving a lazy screen stuck at "Loading..." forever with no error and
  // no way out. Capture the throw with a narrowly scoped, synchronous-only
  // onerror hook instead: appendChild() runs a classic script synchronously,
  // so any throw from it fires onerror before appendChild itself returns,
  // still inside this function, and is re-thrown here so runSource() and
  // loadBuiltBundle() correctly see a rejected promise and clean up
  // (delete executedSources[src] / builtBundlePromises[name]) exactly like
  // they already do for a fetch/transpile failure. This does NOT make a
  // retry safe from "already been declared" if the failing script got
  // partway through its own top-level consts before throwing (re-running it
  // in the same shared global scope can collide with itself); that would
  // need each source to run in its own isolated scope, a deliberately
  // shared-scope design (CLAUDE.md) this does not change. What it does fix
  // is the far more common case: the failure now surfaces as a real error
  // with a working Retry instead of a silent, permanent hang.
  function execute(code, filename) {
    var s = document.createElement('script');
    s.textContent = code + '\n//# sourceURL=' + filename;
    var caught = null;
    var previousOnError = window.onerror;
    window.onerror = function (message, source, line, col, error) {
      caught = error instanceof Error ? error : new Error(String(message));
      return true;
    };
    try {
      document.head.appendChild(s);
    } finally {
      window.onerror = previousOnError;
    }
    if (caught) throw caught;
  }

  // Routes through showErrOverlay() (first script block above, same page,
  // already defined by the time this can run) instead of toggling #err
  // directly: that gives the user a "Clear cache & reload" button, since
  // boot() has no automatic recovery of its own once it reaches this catch.
  function showError(e) {
    if (typeof showErrOverlay === 'function') {
      showErrOverlay().textContent += '[BOOT] ' + (e && e.message || e) + '\n';
    }
  }

  var openedDb = null;
  var preparedSources = Object.create(null);
  var executedSources = Object.create(null);
  var modulePromises = Object.create(null);
  var builtBundlePromises = Object.create(null);

  function loadBuiltBundle(name) {
    var url = PRECOMPILED_BUNDLES && PRECOMPILED_BUNDLES[name];
    if (!url) return Promise.reject(new Error('Unknown built bundle: ' + name));
    if (builtBundlePromises[name]) return builtBundlePromises[name];
    builtBundlePromises[name] = fetchTextRetry(url).then(function (code) {
      execute(code, url);
    }).catch(function (e) {
      delete builtBundlePromises[name];
      throw e;
    });
    return builtBundlePromises[name];
  }

  // Guard against rare environments where IndexedDB.open() hangs. The loader
  // remains fully functional without it, only the compiled-code reuse is lost.
  var dbPromise = PRECOMPILED_BUILD ? Promise.resolve(null) : Promise.race([
    idbOpen().catch(function () { return null; }),
    new Promise(function (resolve) { setTimeout(function () { resolve(null); }, 3000); }),
  ]).then(function (db) { openedDb = db; return db; });

  // Speculatively fetch Babel only for a truly cold precompile cache. Warm
  // starts never download it, and lazy modules reuse the same promise.
  dbPromise.then(function (db) {
    if (PRECOMPILED_BUILD) return;
    if (!db) { ensureBabel(); return; }
    idbCount(db).then(function (n) { if (n <= 0) ensureBabel(); });
  });

  function prepareSource(src) {
    if (preparedSources[src]) return preparedSources[src];
    preparedSources[src] = Promise.all([dbPromise, fetchTextRetry(src)]).then(function (res) {
      var db = res[0], code = res[1];
      var key = src + '|' + PRESET_TAG;
      var h = hash(code);
      var lookup = db ? idbGet(db, key) : Promise.resolve(null);
      return lookup.then(function (rec) {
        if (rec && rec.h === h && typeof rec.code === 'string') return rec.code;
        return transpile(code, src).then(function (out) {
          if (!db) return out;
          return idbPut(db, key, { h: h, code: out }).then(function () { return out; });
        });
      });
    }).catch(function (e) {
      // A route retry should retry only the failed source. Successful sources
      // remain prepared or executed and are never fetched or compiled again.
      delete preparedSources[src];
      throw e;
    });
    return preparedSources[src];
  }

  function runSource(src) {
    if (executedSources[src]) return Promise.resolve();
    return prepareSource(src).then(function (code) {
      if (executedSources[src]) return;
      execute(code, src);
      executedSources[src] = true;
    });
  }

  function runSourcesInOrder(sources) {
    var chain = Promise.resolve();
    sources.forEach(function (src) {
      chain = chain.then(function () { return runSource(src); });
    });
    return chain;
  }

  function loadModule(name) {
    if (modulePromises[name]) return modulePromises[name];
    var spec = MODULES[name];
    if (!spec) return Promise.reject(new Error('Unknown screen module: ' + name));
    modulePromises[name] = Promise.resolve()
      .then(function () {
        var chain = Promise.resolve();
        (spec.dependencies || []).forEach(function (dependency) {
          chain = chain.then(function () { return loadModule(dependency); });
        });
        return chain;
      })
      .then(function () {
        if (PRECOMPILED_BUNDLES && PRECOMPILED_BUNDLES[name]) {
          return loadBuiltBundle(name);
        }

        throw e;

  }
  window.__loadScreenModule = loadModule;
  // Start a route module before React needs to render it. The module promise
  // is shared with the lazy placeholder, so a pointer prefetch can never load
  // or execute the same source twice.
  window.__prefetchScreen = function (name) {
    return loadModule(name).catch(function () { return null; });
  };

  function loadingStyle(kind) {
    var base = {
      display: 'flex', alignItems: 'center', justifyContent: 'center',
      flexDirection: 'column', gap: 10, color: 'var(--ink-faint)',
      fontFamily: 'Inter, sans-serif', fontSize: 12,

      base.background = 'var(--bg)'; base.padding = 24;

      // TabBar. Let it consume that slot instead of using a viewport minimum,
      // which briefly pushed the dock upward while a lazy screen loaded.

          if (!live) return;

  }

  window.Screens = window.Screens || {};
  var lazyScreens = {
    PlanScreen: 'schedule', PlanViewerScreen: 'schedule', ScheduleEditScreen: 'schedule', ScheduleNewScreen: 'schedule',
    StructuredProgramsScreen: 'schedule', ProgramTemplatesScreen: 'schedule', ProgramPreviewScreen: 'schedule', FiveThreeOneSetupScreen: 'schedule',
    ExercisePicker: 'schedule', DayTypePicker: 'schedule', ExerciseItemEditor: 'schedule',
    TrainingScreen: 'train',
    LibraryScreen: 'lib', ExerciseCreator: 'lib', ExerciseDetailScreen: 'lib', HistoryScreen: 'lib', SessionDetailScreen: 'lib',
    SessionCompareScreen: 'lib', SpectatorScreen: 'lib', ExerciseHistoryScreen: 'lib',
    SettingsScreen: 'settings',
    CoachClientScreen: 'coaching', CoachPlanEditorScreen: 'coaching', CoachNewPlanScreen: 'coaching', CoachingTabScreen: 'coaching',
    CoachingUnreadBanner: 'coaching', CoachingNotesSheet: 'coaching',
    FriendsScreen: 'friends', FriendsMaintenanceScreen: 'friends',
    HealthScreen: 'health', HealthClientLogs: 'health', WaterScreen: 'water', FoodScreen: 'food', MedicationsScreen: 'medications',

  makeLazyScreen('FriendRequestBanner', 'friends', { silent: true });
  makeLazyScreen('TodayCardioWidget', 'cardio', { silent: true });
  makeLazyScreen('RecipeShareSheet', 'food', { kind: 'overlay' });

  makeLazyScreen('XHandlePrompt', 'onboarding', { kind: 'overlay' });

  // DailyLogScreen is referenced as a classic global by HomeScreen rather

  function LazyDailyLogScreen(props) {

        window.DailyLogScreen = LazyDailyLogScreen;

        return;

      setError(null);

        if (!live) return;
        var loaded = window.DailyLogScreen;

          LazyDailyLogScreen.actual = loaded;
          window.DailyLogScreen = LazyDailyLogScreen;
        }

      React.createElement('div', { key: 'label' }, error ? 'Could not load the daily log.' : 'Loading daily log...'),
      error ? React.createElement('button', {
        key: 'retry', onClick: function () { setRetry(function (n) { return n + 1; }); },
        style: { border: '1px solid var(--hair-strong)', borderRadius: 4, padding: '8px 14px', background: 'var(--bg-raised)', color: 'var(--ink)', font: 'inherit', cursor: 'pointer' },
      }, 'Retry') : null,
    ]);
  }
  window.DailyLogScreen = LazyDailyLogScreen;

  function warmModulesWhenIdle(index) {
    if (index >= IDLE_MODULES.length) {
      if (openedDb) { try { openedDb.close(); } catch (e) {} openedDb = null; }
      return;
    }
    var schedule = window.requestIdleCallback || function (cb) { return setTimeout(cb, 250); };
    schedule(function () {
      loadModule(IDLE_MODULES[index])
        .catch(function (e) { console.warn('Lazy module warmup failed:', IDLE_MODULES[index], e); })
        .then(function () { warmModulesWhenIdle(index + 1); });
    });
  }

  var warmupStarted = false;
  window.__startScreenWarmup = function () {
    if (warmupStarted) return;
    warmupStarted = true;
    // Login and the first authenticated paint must stay free of optional
    // compilation. Route-level lazy loading remains available immediately;
    // this pass only prepares screens the user has not opened yet.
    setTimeout(function () { warmModulesWhenIdle(0); }, 1200);
  };

  function boot() {
    if (PRECOMPILED_BUNDLES && PRECOMPILED_BUNDLES.critical) {
      loadBuiltBundle('critical').catch(showError);
      return;
    }
    // Prepare the three critical files in parallel, then execute them in their
    // original order. No noncritical source is fetched or hashed on this path.
    Promise.all(CRITICAL_SOURCES.map(prepareSource)).then(function (compiled) {
      compiled.forEach(function (code, i) {
        execute(code, CRITICAL_SOURCES[i]);
        executedSources[CRITICAL_SOURCES[i]] = true;
      });
    }).catch(showError);
  }

  // "Inject a plain script tag once, dedupe concurrent callers via one shared
  // promise" loader, shared by every lazy <script>-based dependency below.
  //
  // A REJECTION is deliberately NOT memoized: the promise slot is cleared (and
  // the dead tag removed) on failure, so a later call retries with a fresh
  // script tag instead of handing every future caller the same permanent
  // failure. Each of these used to keep its rejected promise forever, which
  // meant one flaky fetch disabled the feature for the whole session with no
  // recovery short of a reload. That bites hardest right after a cache wipe,
  // when nothing is precached and the network is often exactly what was flaky
  // in the first place. __ensureZbarWasm below already worked this way; this
  // brings the script-tag loaders in line with it.

          // SPA fallback or a captive-portal page answers 200 with HTML, and
          // resolving with undefined would memoize that as a good load, so
          // every retry (including the Changelog's Retry button) hands back the
          // same empty result forever.
          var value = read();

  window.__ensureHtml2Canvas = function () {
    return __lazyScript('__h2cPromise', 'https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js',
      function () { return window.html2canvas; }, true);
  };

  // Two large static data files that used to sit in the blocking
  // BUILD_CORE_SCRIPTS block: whatsnew.js (changelog text, needed by app.jsx's
  // post-boot unseen-entries check and by Settings' Changelog sheet) and
  // feature-map-db.js (the feature catalog, needed by the already-lazy Feature
  // Map screen). Same relative path in both the raw source tree and the
  // precompiled build: build.cjs's staticDirectories copy still puts an
  // individual, unbundled copy of each at this exact path in dist/, even
  // though they're no longer folded into core.js there.
  window.__ensureWhatsNew = function () {
    return __lazyScript('__whatsNewPromise', 'src/whatsnew.js', function () { return window.WHATS_NEW; });
  };
  window.__ensureFeatureMapDb = function () {
    return __lazyScript('__featureMapDbPromise', 'src/feature-map-db.js', function () { return window.FEATURE_MAP; });
  };

  // Lazily load ExcelJS the first time an XLSX export is actually requested
  // (Settings → Data → Export Training). Not SheetJS: its free build parses
  // styles but silently drops them on write (no border/fill/alignment
  // survives, confirmed against its own output XML), so borders and vertical
  // centering weren't achievable there.
  window.__ensureXLSX = function () {
    return __lazyScript('__xlsxPromise', 'https://unpkg.com/exceljs@4.4.0/dist/exceljs.min.js',
      function () { return window.ExcelJS; }, true);
  };

  // Lazily load the barcode-scanner decoder (zbar-wasm, a WebAssembly build
  // of the ZBar C library) the first time the food scanner is opened. iOS
  // Safari has no native BarcodeDetector (WebKit has never shipped it), and
  // the previous html5-qrcode-based decoder had years of widely-reported
  // failures decoding 1D barcodes (EAN/UPC) specifically on iOS Safari;
  // zbar-wasm runs its own compiled decoder, so it doesn't depend on any
  // browser barcode API at all. Same on-demand pattern as html2canvas above,
  // not preloaded and not in the SW cache since it (and the food lookup)
  // needs the network. Native dynamic import(), not a script tag: the
  // published browser build is an ES module.
  window.__ensureZbarWasm = function () {
    if (window.__zbarWasm) return Promise.resolve(window.__zbarWasm);
    if (!window.__zbarWasmPromise) {

})();
</script>
