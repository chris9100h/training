name: Syntax check

# The source tree remains a no-build fallback for GitHub Pages. The build check
# also exercises the precompiled dist/ output used by Cloudflare previews.
on:
  push:
  pull_request:
  workflow_dispatch: # allow running the checks manually from the Actions tab

jobs:
  transpile:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
      - run: npm ci
      - run: node tools/check-syntax.cjs
      - run: npm run build
      - run: node tools/check-build.cjs
      # check-sw.cjs defaults to the checked-in root sw.js; run it a second
      # time against the patched dist/sw.js (rewritten ASSETS list, see
      # build.cjs's patchServiceWorker) so a bad rewrite gets the same
      # vm-driven routing/offline/waitUntil coverage as the source file.
      - run: node tools/check-sw.cjs dist/sw.js
      # Edge Functions are TypeScript modules outside the browser loader. Keep
      # their syntax covered by the same CI job so a deploy cannot hide a
      # broken cron/helper file from the green app check.
      - run: node tools/check-edge-functions.cjs
      # One runner keeps the focused unit suite in one place and also includes
      # the coaching-drive storage helper test that used to be easy to miss.
      - run: npm test
      # The keyboard/viewport bug class has shipped twice (sheets pushed off
      # the top of the screen on Android, wizard panels cut off on iOS). Both
      # were invisible on desktop and in every other gate, so this one walks
      # the AST for overlays that size themselves against the layout viewport
      # instead of the visible one.
      - run: node tools/check-viewport-geometry.cjs
      # Replays all migrations and verifies schema.sql + docs/database.md
      # were updated alongside them (offline half of the DB drift checks;
      # the live half runs weekly via db-drift.yml).
      - run: node tools/check-db-docs.cjs
      # Runs export→import in a sandbox and verifies a backup round-trips every
      # schema column, so export/import can't silently drift from the DB.
      - run: node tools/check-backup-coverage.cjs
      # The public features.html sits outside the service worker; verify its
      # ?v= cache-buster tracks the sw.js CACHE version so branch/prod deploys
      # never serve it a stale feature-map catalog.
      - run: node tools/check-cache-version.cjs
      # House rule: no em-dashes anywhere. A sweep removed 926 of them; this
      # keeps them from creeping back in via app text or changelog entries.
      - run: node tools/check-emdash.cjs
      # Every source index.html loads must also be in sw.js ASSETS. A file
      # missing there boots fine on a warm cache and blanks the app offline
      # or mid-deploy, when it is the only fetch that has to hit the network.
      - run: node tools/check-asset-parity.cjs
      # sw.js had no runtime coverage anywhere, which is how a branch comparing
      # an absolute URL to a pathname shipped as dead code through six green
      # gates. This loads the real sw.js in a node vm and drives real requests
      # through the fetch handler: routing, offline fallbacks, waitUntil.
      - run: node tools/check-sw.cjs
