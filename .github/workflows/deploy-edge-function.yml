name: Deploy Edge Function

# Manual only, no push trigger: pick the branch to deploy from via the
# "Use workflow from" dropdown when running this from the Actions tab (that's
# a native GitHub Actions feature, nothing to configure here), then type the
# function's folder name under supabase/functions/.
#
# Needs the SUPABASE_ACCESS_TOKEN repository secret (Supabase dashboard →
# account menu → Access Tokens → Generate new token). This is a management-
# API token for the CLI, not the same as the SUPABASE_SERVICE_ROLE_KEY secret
# the other workflows use (that one is a database-level key, it can't
# authenticate a function deploy).
on:
  workflow_dispatch:
    inputs:
      function_name:
        description: 'Function folder name under supabase/functions/ (e.g. ai-daily-summary)'
        required: true
        type: string

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Deploy ${{ inputs.function_name }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase functions deploy "${{ inputs.function_name }}" --project-ref ebbuvdzgstrhrcsbrlez
