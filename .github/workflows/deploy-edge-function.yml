name: Deploy Edge Functions

# Manual only, no push trigger: pick the branch to deploy from via the
# "Use workflow from" dropdown when running this from the Actions tab (that's
# a native GitHub Actions feature, nothing to configure here), then list one
# or more function folder names under supabase/functions/, separated by
# commas and/or spaces (e.g. "ai-daily-summary, ai-checkin-opinion"). Each
# name deploys independently: one bad name doesn't stop the rest, but the run
# still ends failed overall if any of them did.
#
# Needs the SUPABASE_ACCESS_TOKEN repository secret (Supabase dashboard →
# account menu → Access Tokens → Generate new token). This is a management-
# API token for the CLI, not the same as the SUPABASE_SERVICE_ROLE_KEY secret
# the other workflows use (that one is a database-level key, it can't
# authenticate a function deploy).
on:
  workflow_dispatch:
    inputs:
      function_names:
        description: 'Function folder names under supabase/functions/, comma and/or space separated (e.g. ai-daily-summary, ai-checkin-opinion)'
        required: true
        type: string

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: supabase/setup-cli@ab058987d8d6c725971f6cf9d0b5c98467e30bd1 # v1.7.1
        with:
          version: 2.115.0
      - name: Deploy functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          FUNCTION_NAMES: ${{ inputs.function_names }}
        run: |
          # Comma and/or whitespace separated; blank entries dropped so a
          # trailing comma or a double space can't produce an empty function
          # name. Read from env, not interpolated directly into the script,
          # so the input string is never parsed as shell syntax.
          IFS=', ' read -ra names <<< "$FUNCTION_NAMES"
          failed=()
          for name in "${names[@]}"; do
            [ -z "$name" ] && continue
            echo "::group::Deploy $name"
            if supabase functions deploy "$name" --project-ref ebbuvdzgstrhrcsbrlez; then
              echo "$name deployed"
            else
              echo "$name FAILED"
              failed+=("$name")
            fi
            echo "::endgroup::"
          done
          if [ ${#failed[@]} -gt 0 ]; then
            echo "Failed: ${failed[*]}"
            exit 1
          fi
